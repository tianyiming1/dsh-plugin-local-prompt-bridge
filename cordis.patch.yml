# Stock-safe community plugin: local OpenAI-compat tokenize pressure + overflow → compact-retry.
# Does not replace llm-pi-ai / token-meter / compaction-basic.
#
# Defaults are provider-neutral:
# - rewriteOverflow applies to EVERY llm/stream (no route list required)
# - proactiveCompact only runs for entries you list under `routes`
# Align each route's provider / baseURL / contextWindow with your llm-pi-ai providers.
- insert:
    - id: local-prompt-bridge
      name: "@local/dsh-plugin-local-prompt-bridge"
      config:
        # Empty by default — fill with YOUR local OpenAI-compat routes, e.g.:
        # routes:
        #   - provider: llama-cpp-local
        #     baseURL: http://127.0.0.1:8080/v1
        #     contextWindow: 65536
        routes: []
        thresholdRatio: 0.75
        tokenizeEndpoint: /tokenize
        templateEndpoint: /apply-template
        rewriteOverflow: true
        proactiveCompact: true
